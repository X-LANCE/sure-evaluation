title: ETC-Bench transcript scoring
summary: Normalize equivalent written forms on both sides of an ASR comparison in
  12 languages.
limitations: Supply the ETC checkpoint. Arabic, Japanese and Chinese use CER. The
  other nine language routes use WER.
pipeline_brief: Ref + hypothesis → ETC canonicalization → WeNet CER or WER
