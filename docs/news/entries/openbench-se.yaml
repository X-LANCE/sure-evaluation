title: OpenBench speech enhancement
summary: Score intelligibility, spectral distortion and predicted speech quality with
  opt-in metrics.
limitations: Reference-based metrics require aligned clean audio. Learned quality
  estimates depend on the selected model.
pipeline_brief: Enhanced audio (+ reference as needed) → metric scorer → corpus mean
