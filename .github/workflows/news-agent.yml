name: Announcement checks

on:
  pull_request:
    paths:
      - 'news-agent/**'
      - 'docs/news/**'
      - 'README.md'
      - '.github/workflows/news-agent.yml'
  push:
    branches: [main]
    paths:
      - 'news-agent/**'
      - 'docs/news/**'
      - 'README.md'
      - '.github/workflows/news-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install announcement dependencies
        run: python -m pip install -e 'news-agent[dev]'
      - name: Validate publication boundaries and generated files
        run: |
          python -m pytest news-agent/tests -q
          sure-news-agent --config news-agent/config.yaml.example check
