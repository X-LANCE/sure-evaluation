[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sure-news-agent"
version = "0.1.0"
description = "Independent, evidence-bound SURE evaluation news generator"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.1"]
preview = ["markdown-it-py>=3"]

[project.scripts]
sure-news-agent = "news_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
news_agent = ["prompts/*.md", "templates/*.html"]
